[package]
name = "check_di_registry"
version = "0.1.0"
description = "Check-Di integrity registry for Solana"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "check_di_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.1.2"

[lints.rust]
unexpected_cfgs = "allow"
